name: Release

# Every push to main is a release: tag the next minor, build, publish both
# packages to npm (OIDC trusted publishing, provenance), and cut a GitHub
# Release with generated notes. Same shape as autonoco/buttons and pinbox.
#
# The git tag is the version. Manifests are stamped in this workspace only —
# never committed back to main. No version PRs, no changesets.
#
# To skip a release: include [skip release] in the merge commit.
# Bot commits are skipped automatically.
#
# npm's trusted publisher for both packages is pinned to this filename.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to recover (for example, v0.2.0)
        required: true
        type: string

concurrency:
  group: open-pages-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag and release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SEMVER='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          if [ -n "$REQUESTED_TAG" ]; then
            if ! printf '%s' "$REQUESTED_TAG" | grep -Eq "^v${SEMVER}$"; then
              echo "Invalid recovery tag: $REQUESTED_TAG" >&2
              exit 1
            fi
            TAG_SHA=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Recovery checkout mismatch: $REQUESTED_TAG points to $TAG_SHA, checked out $HEAD_SHA" >&2
              exit 1
            fi
            echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Recovering existing release: $REQUESTED_TAG"
            exit 0
          fi

          # Rerun guard: a previous attempt may have tagged this SHA and then
          # failed later. Reuse that tag instead of minting the next one.
          EXISTING_TAG=$(
            git tag --points-at HEAD --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          if [ -n "$EXISTING_TAG" ]; then
            echo "version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing release tag: $EXISTING_TAG"
            exit 0
          fi

          LATEST=$(
            git tag --list 'v*' --sort=-version:refname |
              grep -E "^v${SEMVER}$" |
              head -n1 || true
          )
          # With no v* tag yet, the baseline is whatever npm already has; a
          # package that has never been published starts at v0.1.0.
          if [ -z "$LATEST" ]; then
            PUBLISHED=$(npm view @autono/open-pages version 2>/dev/null || true)
            if [ -z "$PUBLISHED" ]; then
              LATEST="v0.0.0"
            elif printf '%s' "$PUBLISHED" | grep -Eq "^${SEMVER}$"; then
              LATEST="v$PUBLISHED"
            else
              echo "Could not determine the published npm baseline: $PUBLISHED" >&2
              exit 1
            fi
          fi
          VERSION="${LATEST#v}"
          MAJOR=$(printf '%s' "$VERSION" | cut -d. -f1)
          MINOR=$(printf '%s' "$VERSION" | cut -d. -f2)
          NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
          echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${LATEST:-none} → $NEXT_TAG"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # No dependency cache: this job holds id-token: write and publishes to
      # npm, so a poisoned cache entry could reach the registry. No
      # registry-url either: it exports a placeholder NODE_AUTH_TOKEN that npm
      # sends instead of the OIDC token, and trusted publishing then 404s.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the tag version
        run: node tools/release/stamp-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        run: pnpm turbo run build --filter=@autono/open-pages --filter=@autono/create-open-pages

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          for dir in packages/core packages/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            # A rerun after a partial failure must not fail on the package
            # that already went out.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on npm, skipping"
              continue
            fi
            (cd "$dir" && npm publish --access public --ignore-scripts)
          done

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes
