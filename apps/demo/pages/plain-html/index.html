<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plain HTML page</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Plain HTML works too</h1>
      <p>
        A page folder can hold an <code>index.html</code> instead of a React module. The workspace
        serves it as-is, and <code>open-pages export</code> builds it into a static folder like
        any other page.
      </p>
      <button id="count" type="button">Clicked 0 times</button>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
